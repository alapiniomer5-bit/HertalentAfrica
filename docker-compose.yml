services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hertalent
      POSTGRES_USER: hertalent
      POSTGRES_PASSWORD: hertalent
    ports:
      - "5432:5432"
    volumes:
      - hertalent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hertalent -d hertalent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hertalent_pgdata:
